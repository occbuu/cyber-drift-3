out_of_scope:
  cross_dataset_open_set_transfer: every panel method at chance; oracle post-hoc repair 0.533 against
    a 0.93 supervised probe; shared family labels are semantically different phenomena across testbeds
  evidential_head_as_contribution: 'Ablated at five seeds on the two datasets where the
    encoder measurably matters: pooled difference +0.0000 (p = 1.00). Reported as a negative
    ablation; the Dirichlet head shapes training but no claim rests on it.'
  hyperbolic_geometry_as_contribution: curvature = 0 is the default in every runner; ablation within noise
    on all ten metrics (p = 0.23-0.78). Code retained, claim withdrawn
  new_multiple_testing_procedure: BH, BY and the Beta correction are existing tools; the contribution
    is the barrier, the contamination floor and the sizing rules
  first_conformal_nids: ConFID (Internet of Things 40, 2026) and FIRCE (arXiv:2605.01962) both precede
    it; the safe gap is alert-level FDR under realistic prevalence
  host_or_session_alert_aggregation: degenerate on public benchmarks (9 of 15,270 NF-ToN-IoT source hosts
    carry mixed traffic; all NF-UNSW-NB15 attacks originate from 4 addresses). Reported as benchmark criticism
    plus a controlled simulation
  positive_operating_point_at_1e-3_prevalence: 'no configuration tested reaches one: every cell runs an
    aggregate false fraction above 0.29 or emits essentially nothing. Reported as the failure the theory
    predicts, not as a result'
  shrinking_the_alert_window_to_pass_the_barrier: withdrawn 2026-09-13; per-window FDR does not compose
    over a stream (P12) and the aggregate degrades monotonically as the window shrinks
  ten_dataset_loao_sweep: replaced 2026-09-14 by the four-dataset panel over all rotations; about 270
    extra training jobs for no additional claim
