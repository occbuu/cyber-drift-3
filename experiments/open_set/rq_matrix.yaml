  The ten-dataset LOAO sweep is no longer part of the paper; protocols.loao is kept as a runner capability.'

reporting_amendments_2026_09_16:
  why: 'A post-run audit of the saved artefacts found three places where the reported unit did not match
    the claim. The measurements were sound; the aggregation was not.'
  rq1_rq2_calibration_draws:
    problem: 'At its largest calibration size the window sweep reads the entire calibration sample, so its
      five draws share one calibration set and differ only in the stream. Exceedance fractions quoted from
      that cell measure stream noise, not draw-to-draw variation.'
    fix: 'New stage window_draws with calibration sizes 4000/8000/12000, all strictly below the smallest
      calibration set in the panel (12,592), and 12,000 as the headline, the same n on all four datasets.
      Two units are reported, the (seed, subsample) pair and the seed.'
  rq2_level_correction:
    problem: 'corrected_levels was 1, so the Beta bound held at one level while BH interrogates one level
      per rejection; the conditional procedure then exceeded q on 36 to 88 per cent of draws at low
      prevalence.'
    fix: 'delta is split across the operator per-window alert budget (AlertBudget.fallback_alerts_per_window
      = 5). Chosen after the exceedances were seen, from a quantity fixed earlier by the deployment design;
      the paper reports the whole L sweep so the choice stays visible.'
  rq3_replication_unit:
    problem: 'Seed-level blocks (dataset x rotation x seed) were treated as independent, counting each
      rotation five times; Holm p-values near 1e-5 followed from that.'
    fix: 'The rotation is the primary unit (11 rotations, seeds averaged inside). Seed-level numbers stay
      as secondary and are labelled non-independent.'
  rq3_far_resolution:
    problem: 'TPR at a 1e-4 false-alarm rate rests on 1.6 to 5.6 known test flows on these splits.'
    fix: 'Report TPR at 1e-2 and 1e-3 and state that 1e-4 is unresolvable at this test size.'
  rq4_exchangeable_definition:
    problem: 'Conditions at shift magnitude zero counted as exchangeable even on a dataset whose calibration
      split already fails the audit.'
    fix: 'Magnitude zero counts as exchangeable only where the baseline audit passes. Decided after seeing
      the first aggregate; disclosed as such.'
  data_limitations_to_report:
  - 'nf_cse_cic_ids2018_v3 has 10,505 of 223,507 distinct flows (4.7 per cent) carrying more than one family
    label, 10,403 of them dos_attacks_slowhttptest with ftp_bruteforce, the pair the separability audit
    flags at 0.505'
  - 'ciciomt2024 calibration and test splits carry different family mixes, which is why the audit refuses
    the dataset on all five seeds; this is a property of the partition, not of any detector'
  - 'EFC returns identical AUROC on all five seeds because it does not depend on the seed, so its zero
    interval is not a stability measurement'
  - 'the device scorer evaluates the statistics in float32, giving Spearman at least 0.9996 against the
    NumPy reference, with p99 relative error 0.06 on cicids2017 and 0.46 on nf_cse_cic_ids2018_v3'

method_naming_2026_09_17:
  detector_paper_name: 'Prototype Conformal Fusion (PCF)'
  code_identifier: 'hedl (unchanged in every module, result file and figure so the artefact stays
    reproducible; the paper states the mapping once)'
  why: 'Two components in the original name could not be told from their own removal, so neither is
    claimed. What survives measurement is the prototype-trained encoder and the conformal fusion.'
  evidence:
    trained_encoder: 'replacing the encoder with the identity costs 0.003 to 0.656 unknown AUROC across
      the four datasets, so the encoder is kept'
    knn_component: 'adds +0.0021 on cse2018, kept'
    hyperbolic_geometry: 'curvature 0.5 versus the flat limit differs by -0.0003 over three seeds; every
      capture in the study was run at curvature 0 in any case'
    evidential_term: 'weight 1 versus weight 0 over ten paired runs on nf_ton_iot_v3 and ciciomt2024:
      +0.0132 (p = 0.10) and -0.0131 (p = 0.41), pooled +0.0000 (p = 1.00)'
  reported_as: 'both failing components appear in the paper as negative ablations, not as contributions'

gate_amendments_2026_09_18:
  principle: 'The registered wording stays where it is. Amendments are recorded here with the reason, so
    a reader can see both what was promised and what was measured.'
  rq3_tail_lift:
    registered: 'tail lift raises TPR@1e-4 on >=3 datasets with AUROC unchanged to three decimals'
    problem: 'TPR at a 1e-4 false-alarm rate is set by 1.6 to 5.6 known test flows on these splits, so the
      gate asks for a quantity the experiment cannot resolve.'
    amended_to: 'tail lift raises TPR@1e-3 on >=3 datasets with AUROC unchanged to three decimals, with the
      number of known flows above the threshold reported beside each rate'
    outcome: 'not met under either wording: TPR@1e-3 rises on 2 of 4 datasets and every difference lies
      inside the seed interval. The mechanism is real and is reported as such - the tie at the score
      ceiling falls from 4,200 flows to 1 - but the benefit is not measurable at this test size.'
  rq3_mondrian:
    registered: '>=1 dataset where covariate-grouped Mondrian lifts an in-group ceiling that was zero'
    outcome: 'run on 2026-09-18 for three grouping variables (predicted class, destination-port class,
      protocol) over four datasets and five seeds. Not met: one group crosses zero with in-group power
      2.5e-4, a rounding artefact. Grouping otherwise costs power, which is what the break-even condition
      predicts when the grouping variable does not concentrate attacks; the verdict is correct for 59 of
      80 groups.'
  rq4_gate:
    registered: 'the gate fires on >=90% of shift conditions where the ceiling collapses with <=10% false
      refusal on exchangeable traffic'
    outcome: 'met in aggregate (90.6% and 8.0%) and failed on cicids2017 (59.8% and 10.3%). Reported per
      dataset as well as in aggregate, with the severity of the missed conditions: on cicids2017 the median
      broken-condition FDP is 0.200 and 28% of them sit within 0.02 of the budget, while the gate catches
      98.7% of the severe breaks on ciciomt2024 where the median FDP is 0.888.'
  rq1_c:
    registered: 'the barrier binds every panel method'
    outcome: 'met as currency invariance (e-BH beats Bates BH in 0 of 64 cells). Not met in the stronger
      reading: at the largest calibration budget three cells retain power 0.148 to 0.215 at pi = 1e-3,
      while 27 of 32 sit below 0.01. The binding constraint at that prevalence is the detector ceiling, not
      the calibration budget, and the pre-stream classification says so.'
  rq3_detector_margin:
    note: 'Added because a reviewer will compute it: against the strongest other method in each rotation the
      mean margin is -0.001 AUROC [-0.097, +0.070] over a cluster bootstrap on rotations, so no claim of
      detector superiority is made anywhere in the paper.'
