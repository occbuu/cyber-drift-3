research_questions:
  rq1_attainability:
    priority: 1
    carries: the central claim
    question: Under what conditions on calibration budget, false-discovery budget and attack prevalence
      does a distribution-free alert-quality guarantee exist for an open-set NIDS, and what is the realised
      alert quality when those conditions fail?
    theory:
    - T1 distribution-free floor p >= 1/(n+1)
    - T2 resolution barrier n >= 1/(q pi), window size cancels
    - T3 screening invariance
    - T4 contamination floor FDP >= 1 - m pi / r_min
    - 'T7 currency invariance: conformal e-BH meets the same r_min'
    - 'P12 windowing does not compose: per-window FDR control does not bound the FDR of the union, and
      the aggregate degrades as m shrinks'
    protocols:
    - prevalence
    runners:
    - experiments.open_set.capture_scores
    - experiments.open_set.run_resolution  (per-window diagnostics)
    - experiments.open_set.run_window  (stream-level aggregate; the reported quantity)
    metrics:
    - aggregate_fdp_over_stream
    - streams_over_budget
    - aggregate_power
    - alerts_per_1000_flows
    - per_window_fdp_given_alert_vs_contamination_floor
    - predicted_resolution_feasible
    procedure_baselines:
    - bates_split_conformal_bh
    - benjamini_yekutieli
    - storey_bh
    - full_conformal_evalue
    claim_gate: T4 bound holds on every below-barrier firing cell across >=4 datasets x 3 seeds; >=1 dataset
      demonstrates the positive side AT pi = 1e-2 with the stream-level aggregate FDR within q on every
      calibration draw and non-trivial power; the barrier binds every panel method.
    headline_prevalence: 0.01
    measured_prevalences:
    - 0.25
    - 0.1
    - 0.05
    - 0.01
    - 0.001
    reporting_unit: 'stream: a run of flows at prevalence pi partitioned into windows of size m, each
      decided independently; the aggregate false fraction over the union is what is reported. Per-window
      FDP is a diagnostic, not the claim.'
  rq2_keepability:
    priority: 2
    carries: the deployment claim
    question: When an alert-quality guarantee holds on average over calibration draws, does it hold for
      the single calibration sample a deployment actually has, and what does enforcing the stronger guarantee
      cost?
    theory:
    - T5 training-conditional floor Beta(1, n)
    - corrected sizing rule n >= ln(1/delta)/(q pi)
    protocols:
    - prevalence
    runners:
    - experiments.open_set.run_resolution --calibration-draws
    metrics:
    - fdr_per_calibration_draw
    - fraction_of_draws_over_budget
    - power_vs_clairvoyant_ceiling
    - certificate_state
    claim_gate: marginal BH exceeds q on >=10% of draws in >=2 datasets; the conditional procedure on
      0%; power price <=15% relative where the conditional budget is met.
  rq3_reachability:
    priority: 3
    carries: the detector-side claim
    question: Once a guarantee is available, what caps the attainable power, and can that cap be raised
      without spending validity?
    theory:
    - conformal-fusion score ceiling sum_i w_i log(n_tuning + 1)
    - known-class heterogeneity as a top-of-ranking precision cap
    - Mondrian break-even n >= G/(q pi c_g)
    protocols:
    - loao
    - prevalence
    runners:
    - experiments.open_set.capture_scores --tail-extension
    - experiments.open_set.run_frontier
    - experiments.open_set.run_resolution
    - experiments.open_set.run_mondrian  (Prop. 11, grouping by predicted class)
    - experiments.open_set.separability  (hold-out groups, registered 2026-09-14)
    metrics:
    - clairvoyant_power_vs_prevalence
    - prevalence_floor
    - tpr_at_far_1e-3_1e-4_1e-5_with_resolvability_flag
    - test_scores_at_maximum
    - per_group_ceiling_under_mondrian
    secondary_metrics:
    - known_accuracy
    - known_macro_f1
    - unknown_auroc
    - fpr95
    - aupr_out
    - oscr
    - open_world_macro_f1
    claim_gate: tail lift raises TPR@1e-4 on >=3 datasets with AUROC unchanged to three decimals; >=1
      dataset where covariate-grouped Mondrian lifts an in-group ceiling that was zero; the break-even
      condition predicts in advance which grouping variables fail.
    supporting_table: eight-method panel, four deployment datasets, all rotations, five seeds; across-rotation
      spread compared with within-rotation seed spread
  rq4_shift_behaviour:
    priority: 4
    carries: the honesty claim
    question: When the deployment environment changes so that the guarantee no longer applies, does the
      system detect that and abstain, and what does a target labelling budget buy?
    theory:
    - exchangeability audit, two-sample DKW critical value
    - 'two-currency label budget: family labels buy ranking and saturate around ten per class; verified-known
      flows buy the right to make a claim'
    protocols:
    - shift
    runners:
    - experiments.open_set.run_budget
    - experiments.open_set.run_shift_gate  (label-mix shift on cached scores, replaces the legacy shift
      protocol for the gate claim, 2026-09-14)
    metrics:
    - gate_detection_rate_vs_shift_magnitude
    - false_refusal_rate_on_exchangeable_traffic
    - false_alarm_rate_with_and_without_gate
    - unknown_auroc_vs_family_label_budget
    - certificate_state_vs_verified_known_budget
    claim_gate: the gate fires on >=90% of shift conditions where the ceiling collapses with <=10% false
      refusal on exchangeable traffic; the two-currency decomposition replicates on >=2 cases x 3 seeds.
    status: reduced 2026-09-13
    removed_2026_09_13: Cross-dataset open-set transfer as a research question. Every panel method sits
      at chance, an oracle sweep over post-hoc repairs tops out at 0.533 against a 0.93 supervised probe,
      and shared family labels denote different phenomena across testbeds. Retained as a measured impossibility
      with a causal localisation, reported in the limitations. This removes the v8 temporal-data dependency
      from the critical path.
