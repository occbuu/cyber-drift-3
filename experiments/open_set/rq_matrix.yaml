# Locked experiment matrix.
#
# Two levels, deliberately not one-to-one.  `research_questions` is what the
# paper asks, in priority order.  `protocols` is what the runners execute.  One
# protocol feeds several questions; numbering the protocols after the questions
# is what produced the earlier confusion between "RQ3" the section and "rq3" the
# command-line flag.
#
# Amended 2026-09-14: supporting table is the 4-dataset panel over all rotations.
# Amended 2026-09-13: RQ1's headline prevalence is 1e-2 and the reporting unit
# is the stream; RQ4 is reduced to the gate and the label budget.
#
# See reports/RQ_DESIGN_2026-09-12.md for the reasoning.
